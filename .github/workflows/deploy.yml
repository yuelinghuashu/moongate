name: Deploy To Aliyun

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: |
          NUXT_PUBLIC_SITE_URL=https://moongate.top \
          pnpm run build
        env:
          NUXT_PUBLIC_SITE_URL: https://moongate.top

      - name: Deploy to Server via Rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: .output/
          remote_path: /var/www/my-site/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Start/Reload Node.js service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NUXT_SESSION_PASSWORD, NUXT_OAUTH_GITHUB_CLIENT_ID, NUXT_OAUTH_GITHUB_CLIENT_SECRET
          script: |
            echo "🚀 启动 Node.js SSR 服务..."
            cd /var/www/my-site

            # 验证环境变量
            if [ -z "$NUXT_SESSION_PASSWORD" ]; then
              echo "❌ NUXT_SESSION_PASSWORD 未设置"
              exit 1
            fi

            # 生成 PM2 配置文件
            cat > ecosystem.config.js << EOF
            module.exports = {
              apps: [{
                name: "moongate",
                script: "./server/index.mjs",
                instances: 1,
                exec_mode: "fork",
                env: {
                  NODE_ENV: "production",
                  NUXT_PUBLIC_SITE_URL: "https://moongate.top",
                  PORT: 3000,
                  HOST: "0.0.0.0",
                  NUXT_SESSION_PASSWORD: "$NUXT_SESSION_PASSWORD",
                  NUXT_OAUTH_GITHUB_CLIENT_ID: "$NUXT_OAUTH_GITHUB_CLIENT_ID",
                  NUXT_OAUTH_GITHUB_CLIENT_SECRET: "$NUXT_OAUTH_GITHUB_CLIENT_SECRET"
                }
              }]
            }
            EOF

            echo "✅ PM2 配置文件已生成"

            # 启动或重启应用
            if pm2 describe moongate > /dev/null 2>&1; then
              echo "🔄 重启现有应用..."
              pm2 reload ecosystem.config.js --update-env
            else
              echo "🚀 启动新应用..."
              pm2 start ecosystem.config.js
            fi

            pm2 save
            echo "✅ 服务状态："
            pm2 status moongate