name: Deploy To Aliyun Server

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: |
          NUXT_PUBLIC_SITE_URL=https://moongate.top \
          pnpm run build

      - name: Deploy to Server via Rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete # 递归、压缩、同步删除
          path: .output/ # Nuxt 的文件输出目录
          remote_path: /var/www/my-site/ # 服务器上的目标目录
          remote_host: ${{ secrets.SERVER_HOST }} # 服务器 IP
          remote_user: ${{ secrets.SERVER_USER }} # 登录用户名
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }} # SSH 私钥

      - name: Start/Reload Node.js service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 启动 Node.js SSR 服务..."
            cd /var/www/my-site

            # 创建或更新 PM2 配置文件
            cat > ecosystem.config.js << 'EOF'
            module.exports = {
              apps: [{
                name: "moongate",
                script: "./server/index.mjs",
                instances: 1,
                exec_mode: "fork",
                env: {
                  NODE_ENV: "production",
                  NUXT_PUBLIC_SITE_URL: "https://moongate.top",
                  PORT: 3000,
                  HOST: "0.0.0.0"
                }
              }]
            }
            EOF

            echo "📁 PM2 配置文件已生成"

            # 使用配置文件管理应用
            if pm2 describe moongate > /dev/null 2>&1; then
              echo "🔄 重启现有应用（使用最新配置）..."
              pm2 reload ecosystem.config.js --update-env
            else
              echo "🚀 启动新应用..."
              pm2 start ecosystem.config.js
            fi

            # 保存 PM2 配置以便开机自启
            pm2 save
            
            echo "✅ 服务启动完成"
            pm2 status moongate
