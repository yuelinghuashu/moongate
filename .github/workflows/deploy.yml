name: Deploy To Aliyun

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_SITE_URL: https://moongate.top

    strategy:
      matrix:
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Deploy to Server via Rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete # 递归、压缩、同步删除
          path: .output/ # Nuxt 的文件输出目录
          remote_path: /var/www/my-site/ # 服务器上的目标目录
          remote_host: ${{ secrets.SERVER_HOST }} # 服务器 IP
          remote_user: ${{ secrets.SERVER_USER }} # 登录用户名
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }} # SSH 私钥

      - name: Start/Reload Node.js service
        uses: appleboy/ssh-action@v1.0.0
        env:
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_OAUTH_GITHUB_CLIENT_ID: ${{ secrets.NUXT_OAUTH_GITHUB_CLIENT_ID }}
          NUXT_OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.NUXT_OAUTH_GITHUB_CLIENT_SECRET }}
          NUXT_DATABASE_URL: ${{ secrets.NUXT_DATABASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NUXT_PUBLIC_SITE_URL, NUXT_DATABASE_URL, NUXT_SESSION_PASSWORD, NUXT_OAUTH_GITHUB_CLIENT_ID, NUXT_OAUTH_GITHUB_CLIENT_SECRET
          script: |
            echo "🚀 启动 Node.js SSR 服务..."
            cd /var/www/my-site

            # 验证环境变量
            if [ -z "$NUXT_SESSION_PASSWORD" ]; then
              echo "❌ NUXT_SESSION_PASSWORD 未设置"
              exit 1
            fi

            # 生成 PM2 配置文件
            cat > ecosystem.config.js << EOF
            module.exports = {
              apps: [{
                name: "moongate",
                script: "./server/index.mjs",
                env: {
                  NODE_ENV: "production",
                  NUXT_PUBLIC_SITE_URL: "$(echo -n "$NUXT_PUBLIC_SITE_URL")",
                  PORT: 3000,
                  HOST: "0.0.0.0",
                  NUXT_DATABASE_URL: "$(echo -n "$NUXT_DATABASE_URL")",
                  NUXT_SESSION_PASSWORD: "$(echo -n "$NUXT_SESSION_PASSWORD")",
                  NUXT_OAUTH_GITHUB_CLIENT_ID: "$(echo -n "$NUXT_OAUTH_GITHUB_CLIENT_ID")",
                  NUXT_OAUTH_GITHUB_CLIENT_SECRET: "$(echo -n "$NUXT_OAUTH_GITHUB_CLIENT_SECRET")",
                }
              }]
            }
            EOF

            echo "✅ PM2 配置文件已生成"

            # 启动或重启应用
            if pm2 describe moongate > /dev/null 2>&1; then
              echo "🔄 重启现有应用..."
              pm2 reload ecosystem.config.js --update-env
            else
              echo "🚀 启动新应用..."
              pm2 start ecosystem.config.js
            fi

            pm2 save
            echo "✅ 服务状态："
            pm2 status moongate
