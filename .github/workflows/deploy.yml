name: Deploy To Aliyun (Docker)

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ secrets.NUXT_PUBLIC_SITE_URL }}
            NUXT_PUBLIC_API_URL=http://go-backend:8080
          tags: |
            ${{ secrets.ACR_REGISTRY }}/moongate/moongate-blog:latest
            ${{ secrets.ACR_REGISTRY }}/moongate/moongate-blog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          NUXT_PUBLIC_SITE_URL: ${{ secrets.NUXT_PUBLIC_SITE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD,NUXT_PUBLIC_SITE_URL
          script: |
            set -e
            cd /var/www/my-site

            # ✅ 只需要这些环境变量（其他在 docker-compose.yml 中写死了）
            cat > .env << EOF
            NUXT_PUBLIC_SITE_URL=$NUXT_PUBLIC_SITE_URL
            ACR_REGISTRY=$ACR_REGISTRY
            EOF

            # 登录 ACR
            echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin

            # 拉取新镜像并重启
            docker compose pull nuxt-app
            docker compose up -d --force-recreate nuxt-app caddy

            # 清理旧镜像
            docker image prune -f --filter "until=24h"