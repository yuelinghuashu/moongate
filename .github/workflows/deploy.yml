name: Deploy Nuxt Frontend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_DOMAIN }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Nuxt image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 显式禁用 provenance 和 SBOM attestations，
          # 解决阿里云 ACR 不支持 OCI attestation manifest 导致的推送失败：
          # denied: unknown manifest class for application/vnd.oci.empty.v1+json
          provenance: false
          sbom: false
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ secrets.NUXT_PUBLIC_SITE_URL }}
            NUXT_PUBLIC_API_URL=https://moongate.top
          tags: |
            ${{ secrets.ACR_DOMAIN }}/${{ secrets.ACR_NAMESPACE }}/moongate-blog:latest
            ${{ secrets.ACR_DOMAIN }}/${{ secrets.ACR_NAMESPACE }}/moongate-blog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACR_DOMAIN: ${{ secrets.ACR_DOMAIN }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          NUXT_PUBLIC_SITE_URL: ${{ secrets.NUXT_PUBLIC_SITE_URL }}
          NUXT_PUBLIC_API_URL: https://moongate.top
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: |
            ACR_DOMAIN,
            ACR_NAMESPACE,
            ACR_USERNAME,
            ACR_PASSWORD,
            NUXT_PUBLIC_SITE_URL,
            NUXT_PUBLIC_API_URL
          script: |
            set -e
            cd /var/www/my-site

            # 更新前端变量
            sed -i '/^NUXT_PUBLIC_SITE_URL=/d' .env 2>/dev/null || true
            sed -i '/^NUXT_PUBLIC_API_URL=/d' .env 2>/dev/null || true
            sed -i '/^ACR_REGISTRY=/d' .env 2>/dev/null || true
            cat >> .env << EOF
            NUXT_PUBLIC_SITE_URL=$NUXT_PUBLIC_SITE_URL
            NUXT_PUBLIC_API_URL=$NUXT_PUBLIC_API_URL
            ACR_REGISTRY=$ACR_DOMAIN/$ACR_NAMESPACE
            EOF

            echo "$ACR_PASSWORD" | docker login "$ACR_DOMAIN" -u "$ACR_USERNAME" --password-stdin

            docker compose pull nuxt-app
            docker compose up -d --no-deps --force-recreate nuxt-app
            docker compose up -d --no-deps --force-recreate caddy

            docker image prune -f --filter "until=24h"

            docker compose ps
